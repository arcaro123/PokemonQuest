name: Publicar el joc a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Copia només el joc a una carpeta i el compila amb pygbag
      - name: Compilar amb pygbag
        run: |
          pip install pygbag
          mkdir game
          cp main.py game/
          cp -r assets game/
          python -m pygbag --build game

      # Pàgina d'inici (per a Google) a l'arrel i el joc a /play/
      - name: Preparar el lloc web
        run: |
          mkdir -p _site/play
          cp -r web/. _site/
          cp -r game/build/web/. _site/play/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
